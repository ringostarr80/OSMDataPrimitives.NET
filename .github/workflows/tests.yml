# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Tests

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout to read the repository

    strategy:
      matrix:
        dotnet: ['8.0', '9.0', '10.0']
    
    name: .NET ${{ matrix.dotnet }} Tests

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        env:
          DOTNET_VERSION: ${{ matrix.dotnet }}
        run: dotnet build --framework=net"$DOTNET_VERSION"
      - name: Test
        env:
          DOTNET_VERSION: ${{ matrix.dotnet }}
        run: |
          dotnet test --framework=net"$DOTNET_VERSION" --no-build --verbosity normal --collect:"XPlat Code Coverage"
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.dotnet == '10.0' }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
